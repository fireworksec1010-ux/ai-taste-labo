    var a = [
      // 0: microwave & bowl — convenience
      '<svg viewBox="0 0 110 110" aria-hidden="true"><rect x="8" y="30" width="94" height="56" rx="10" fill="#fff" stroke="#2a78d6" stroke-width="3"/><rect x="18" y="40" width="52" height="36" rx="6" fill="#e8f1fc" stroke="#2a78d6" stroke-width="2.5"/><path d="M30 68c4-8 20-8 26 0z" fill="#eda100"/><ellipse cx="43" cy="69" rx="16" ry="4.5" fill="#d98a12"/><circle cx="84" cy="48" r="4.5" fill="#2a78d6"/><circle cx="84" cy="62" r="4.5" fill="#9cc1ee"/><rect x="78" y="70" width="13" height="5" rx="2.5" fill="#9cc1ee"/><path d="M38 32c-5-6 5-8 0-15M50 32c-5-6 5-8 0-15" fill="none" stroke="#b9b2a7" stroke-width="3" stroke-linecap="round"/></svg>',
      // 1: price tag & sparkle — value
      '<svg viewBox="0 0 110 110" aria-hidden="true"><g transform="rotate(-10 52 58)"><path d="M26 42h42l16 18-16 18H26z" fill="#fff" stroke="#d03b3b" stroke-width="3.5"/><circle cx="76" cy="60" r="4" fill="#fff" stroke="#d03b3b" stroke-width="3"/><text x="44" y="69" text-anchor="middle" font-family="Zen Old Mincho,serif" font-size="26" font-weight="900" fill="#d03b3b">&#165;</text></g><path d="M84 26l3 8 8 3-8 3-3 8-3-8-8-3 8-3zM22 20l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#eda100"/></svg>',
      // 2: bowl with heart steam — health
      '<svg viewBox="0 0 110 110" aria-hidden="true"><path d="M20 58h70c0 20-15 36-35 36S20 78 20 58z" fill="#1baf7a"/><path d="M26 64h58" stroke="#fff" stroke-opacity=".5" stroke-width="4" stroke-linecap="round"/><ellipse cx="55" cy="58" rx="35" ry="8" fill="#0e8a5e"/><path d="M42 44c0-5 8-5 8 0 0 4-8 9-8 9s-8-5-8-9c0-5 8-5 8 0z" transform="translate(13 -18)" fill="#d03b3b"/><path d="M36 42c-4-6 4-8 0-14" fill="none" stroke="#b9b2a7" stroke-width="3" stroke-linecap="round"/><path d="M72 40c-4-6 4-8 0-14" fill="none" stroke="#b9b2a7" stroke-width="3" stroke-linecap="round"/></svg>',
      // 3: shopping basket — general
      '<svg viewBox="0 0 110 110" aria-hidden="true"><path d="M22 48h66l-8 38H30z" fill="#fff" stroke="#8a5cd1" stroke-width="3.5"/><path d="M38 48l10-20M72 48L62 28" stroke="#8a5cd1" stroke-width="3.5" stroke-linecap="round"/><path d="M36 58v18M50 58v18M64 58v18M76 58l-2 18" stroke="#c9b6ea" stroke-width="3" stroke-linecap="round"/><circle cx="40" cy="40" r="6" fill="#d03b3b"/><rect x="52" y="32" width="10" height="12" rx="3" fill="#eda100"/></svg>'
    ];
    return a[i % a.length];
  }
  function sealSvg(){
    return '<svg class="seal" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="36" fill="none" stroke="#d03b3b" stroke-width="4"/><circle cx="40" cy="40" r="29" fill="#d03b3b"/><text x="40" y="52" text-anchor="middle" font-family="Zen Old Mincho,serif" font-size="32" font-weight="900" fill="#f5f1e8">食</text></svg>';
  }
  function teleSvg(){
    return '<svg class="tele" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="36" fill="rgba(208,59,59,.1)"/><g transform="rotate(-18 40 40)"><rect x="14" y="34" width="34" height="13" rx="4" fill="#d03b3b"/><rect x="46" y="31" width="14" height="19" rx="4" fill="#9e2626"/><rect x="60" y="28" width="7" height="25" rx="3" fill="#6e1a1a"/></g><path d="M30 56l-6 14M40 50v20" stroke="#6e1a1a" stroke-width="4" stroke-linecap="round"/><path d="M66 18l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" fill="#eda100"/></svg>';
  }

  function highlightTile(h){
    var t = TILE[h.link_page] || { icon:"bowl", c:"#2a78d6" };
    return '<div class="highlight-tile" style="--tc:'+t.c+'">'+
      '<div class="ti"><span class="ib">'+JL.icon(t.icon,20,t.c)+'</span><div class="cat">'+en(h,"category")+'</div></div>'+
      '<div class="label">'+en(h,"label")+'</div>'+
      '<div class="detail">'+en(h,"detail")+'</div>'+
      (h.link_page ? '<a href="'+link(h.link_page)+'">'+(en(h,"link_label")||"詳しく見る")+'</a>' : '')+
      '</div>';
  }

  function featureHtml(t, i){
    var prods = (t.products||[]).map(function(p, j){
      var init = (en(p,"company")||"?").replace(/^The /,"").charAt(0).toUpperCase();
      return '<li style="--mc:'+MONO[j % MONO.length]+'"><span class="mono">'+init+'</span><span>'+
        '<span class="co">'+en(p,"company")+'</span>「'+en(p,"name")+'」<span class="dt">'+fmtDate(p.date)+'</span>'+
        '<span class="pt">'+en(p,"point")+'  <a href="'+p.source_url+'" target="_blank" rel="noopener">プレスリリース →</a></span>'+
        '</span></li>';
    }).join("");
    function step(cls, color, icon, label, body){
      return '<div class="flow-step '+cls+'" style="--sc:'+color+'"><span class="medal">'+JL.icon(icon,15,color)+'</span>'+
        '<div class="k">'+label+'</div><div class="v">'+body+'</div></div>';
    }
    return '<article class="feature reveal" style="--fc:'+FEAT_C[i % FEAT_C.length]+'">'+
      '<div class="feat-head"><span class="feat-no">'+(i+1<10?"0":"")+(i+1)+'</span><h3>'+en(t,"title").replace(/^テーマ\d+｜/,"")+'</h3><span class="feat-art">'+featArt(i)+'</span></div>'+
      '<div class="flow">'+
        step("needs", "#2a78d6", "heart", "生活者ニーズの変化", en(t,"needs"))+
        step("market", "#d03b3b", "chart", "市場の動き", en(t,"market")+(t.market_link ? '  <a href="'+link(t.market_link)+'">市場規模ページ →</a>' : ''))+
        step("products", "#1baf7a", "box", "各社の新製品", '<ul class="prod-list">'+prods+'</ul>')+
        step("take", "#b98500", "bulb", "読み取れること（当サイトの見立て）", en(t,"takeaway"))+
      '</div></article>';
  }

  function kicker(icon, color, text){
    return '<div class="kicker reveal"><span class="k-ico" style="background:color-mix(in srgb, '+color+' 10%, #fff)">'+JL.icon(icon,16,color)+'</span>'+text+'</div>';
  }

  function issueHtml(m, idx, total, meta){
    var themes = (m.analysis && m.analysis.themes) || [];
    var toc = themes.map(function(t, i){
      return '<li><span class="no">'+(i+1<10?"0":"")+(i+1)+'</span><span class="t">'+en(t,"title").replace(/^テーマ\d+｜/,"")+'</span></li>';
    }).join("");
    var newsN = (m.domestic_trends||[]).length;
    if(newsN){ toc += '<li><span class="no">＋</span><span class="news">国内の業界ニュース '+newsN+' 本と、来月の注目ポイント</span></li>'; }

    var srcs = ((m.analysis||{}).sources||[]).map(function(s){
      return '<a href="'+s.url+'" target="_blank" rel="noopener">'+en(s,"name")+'</a>';
    }).join(" / ");

    var html = '';
    // cover
    var tags = (m.highlights||[]).slice(0,3).map(function(h, i){
      var t = TILE[h.link_page] || { c:"#2a78d6" };
      return '<div class="tag t'+(i+1)+'" style="--tc:'+t.c+'"><span>'+en(h,"category")+'</span><span class="v">'+en(h,"label")+'</span></div>';
    }).join("");
    html += '<section class="cover reveal"><div class="cover-grid"><div>'+
      '<div class="eyebrow"><span class="dot"></span>'+'月刊 食卓の物価 ・ 第'+(total-idx)+'号'+'</div>'+
      '<h1><span class="hl">'+(m.label_ja||m.ym)+'<span class="brush"></span></span></h1>'+
      '<div class="sub">今月の食品市場を、ひと読みで</div>'+
      '<div class="toc-card"><div class="toc-h">今月の目次</div><ul class="toc">'+toc+'</ul></div>'+
      '<div class="date-line">'+'データ取得日：'+fmtDate(meta.generated_at)+' ・ 出典：総務省統計局、農林水産省、各社公表資料'+'</div>'+
      '</div><div class="scene">'+JL.heroArt()+tags+sealSvg()+'<div class="cap">今夜の食卓</div></div></div></section>';

    // at a glance
    html += kicker("chart", "#d03b3b", "今月のハイライト");
    html += '<div class="highlight-grid reveal">'+(m.highlights||[]).map(highlightTile).join("")+'</div>';

    // features
    if(m.analysis){
      html += kicker("bulb", "#eda100", "特集：生活者ニーズ → 市場 → 新製品");
      html += '<p class="intro-lead reveal">'+en(m.analysis,"intro")+'</p>';
      html += themes.map(featureHtml).join("");
      html += '<div class="analysis-src reveal">主な出典：'+srcs+'<br>'+en(m.analysis,"note")+'</div>';
    }

    // news
    if(newsN){
      html += kicker("paper", "#2a78d6", "国内の業界ニュース");
      html += '<div class="news-col reveal">'+(m.domestic_trends||[]).map(function(t){
        return '<div class="trend-item"><span class="pin">'+JL.icon("paper",18,"#d03b3b")+'</span><div>'+
          '<h3>'+en(t,"title")+'</h3><p>'+en(t,"summary")+'</p>'+
          '<div class="src">出典：'+en(t,"source_name")+'  <a href="'+t.source_url+'" target="_blank" rel="noopener">記事を見る</a></div>'+
          '</div></div>';
      }).join("")+'</div>';
    }

    // outlook
    if(en(m,"outlook")){
      html += kicker("bulb", "#d03b3b", "来月の注目ポイント");
      html += '<div class="outlook-box reveal">'+teleSvg()+'<div>'+en(m,"outlook")+'</div></div>';
    }
    return html;
  }

  function arm(){
    var targets = document.querySelectorAll(".reveal:not(.in)");
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduce || !("IntersectionObserver" in window)){ Array.prototype.forEach.call(targets, function(e){ e.classList.add("in"); }); return; }
    var io = new IntersectionObserver(function(entries){ entries.forEach(function(en2){ if(en2.isIntersecting){ en2.target.classList.add("in"); io.unobserve(en2.target); } }); }, { rootMargin:"0px 0px -6% 0px" });
    Array.prototype.forEach.call(targets, function(e){ io.observe(e); });
  }

  var DATA = null;
  function show(idx){
    document.getElementById("issue-root").innerHTML = issueHtml(DATA.months[idx], idx, DATA.months.length, DATA.meta);
    var tabs = document.querySelectorAll(".issue-tab");
    Array.prototype.forEach.call(tabs, function(b, i){ b.setAttribute("aria-pressed", i===idx ? "true" : "false"); });
    arm();
  }

  fetch("monthly_digest_data.json", { cache:"no-cache" }).then(function(r){ return r.json(); }).then(function(json){
    DATA = json;
    var bar = document.getElementById("issues");
    json.months.forEach(function(m, i){
      var b = document.createElement("button");
      b.type = "button"; b.className = "issue-tab"; b.setAttribute("role","tab");
      b.textContent = m.label_ja || m.ym;
      b.addEventListener("click", function(){ show(i); window.scrollTo({ top:0, behavior:"smooth" }); });
      bar.appendChild(b);
    });
    show(0);
  }).catch(function(err){
    document.getElementById("issue-root").innerHTML = "<p>データの読み込みに失敗しました。ページを再読み込みしてください。</p>";
    console.error(err);
  });

  // reading progress
  var bar = document.getElementById("progress");
  window.addEventListener("scroll", function(){
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max > 0 ? (h.scrollTop/max*100) : 0) + "%";
  }, { passive:true });
})();
</script>
</body>
</html>
